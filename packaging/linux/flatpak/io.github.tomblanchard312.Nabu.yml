# Flatpak manifest for PdfCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.tomblanchard312.Nabu.yml
#   flatpak run io.github.tomblanchard312.Nabu
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from io.github.tomblanchard312.Nabu.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: io.github.tomblanchard312.Nabu
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nabu
finish-args:
  - --filesystem=xdg-run/sharedai
  - --socket=pulseaudio
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Downloads, where PDFs usually live, are granted so files
  # passed by path (the command line, Open Recent, "Save" next to the original) work there.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Network: Help ▸ Check for updates reaches GitHub. The optional --control channel still listens
  # on 127.0.0.1 inside the sandbox.
  - --share=network
  # Deliberately not granted: home/host filesystem access. No CUPS socket either: printing
  # runs the `lp` command (crates/print), which the freedesktop runtime doesn't ship, so Print
  # reports that the spooler is unavailable until it goes through the print portal.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: nabu
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/nabu/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p nabu
      - install -Dm755 target/release/nabu /app/bin/nabu
      - install -Dm644 NOTICE /app/share/doc/nabu/NOTICE
      - install -Dm644 packaging/linux/io.github.tomblanchard312.Nabu.desktop /app/share/applications/io.github.tomblanchard312.Nabu.desktop
      - install -Dm644 packaging/linux/io.github.tomblanchard312.Nabu.mime.xml /app/share/mime/packages/io.github.tomblanchard312.Nabu.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.tomblanchard312.Nabu.metainfo.xml.in > /app/share/metainfo/io.github.tomblanchard312.Nabu.metainfo.xml
      - ENKI_RUNTIME_ARCHIVE=enki-runtime.zip python3 packaging/stage-enki.py --target $(uname -m)-unknown-linux-gnu --out /app/lib/parchfold/enki
    sources:
      - type: file
        url: https://github.com/tomblanchard312/Enki-runtime/releases/download/v0.2.0-preview.2/enki-runtime-0.2.0-preview.2-x86_64-unknown-linux-gnu.zip
        sha256: 142c3e45a8c808215a2067a6d26fa6ba963321aa5fca3cdfc1f76378ef434f29
        dest-filename: enki-runtime.zip
        only-arches: [x86_64]
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
